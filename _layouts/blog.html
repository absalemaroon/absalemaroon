---
layout: default
---

<article class="blog-article">
  <a class="back-link" href="{{ "/blog/" | relative_url }}">&larr; All blog posts</a>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
      {% if page.author %} · {{ page.author }}{% endif %}
    </p>
    {% if page.tags and page.tags.size > 0 %}
      <p class="blog-tags">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</p>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
