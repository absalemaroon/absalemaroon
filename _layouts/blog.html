---
layout: default
---

<article class="blog-article">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_string }}</time>{% endif %}{% if page.author %} - {{ page.author }}{% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
  <p><a class="back-link" href="{{ "/blog/" | relative_url }}">&larr; All blog posts</a></p>
</article>
