---
layout: default
---

<article class="blog-article">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {% if page.date %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}
      {% if page.author %} · {{ page.author }}{% endif %}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
