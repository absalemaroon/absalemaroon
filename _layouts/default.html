<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="site-shell">
      <header class="profile-header">
        <div class="banner" role="img" aria-label="Research technology banner"></div>
        <div class="profile-summary">
          {% if site.logo %}<img class="profile-image" src="{{ site.logo | relative_url }}" alt="Portrait of Absalem Aroon">{% endif %}
          <div class="profile-name-row">
            <h1>Absalem Aroon</h1>
          </div>
        </div>
        <nav class="site-nav" aria-label="Main navigation">
          <a class="active" href="{{ "/" | relative_url }}">Home</a>
          <a href="{{ "/research/" | relative_url }}">Research</a>
          <a href="{{ "/software/" | relative_url }}">Software</a>
          <a href="{{ "/publications/" | relative_url }}">Publications</a>
          <a href="{{ "/certificates/" | relative_url }}">Certificates</a>
          <a href="{{ "/blog/" | relative_url }}">Blog</a>
        </nav>
      </header>
      <main class="content">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ 'now' | date: "%Y" }} Absalem Aroon</span>
        <span>Absalex Labs · Nigeria</span>
      </footer>
    </div>
  </body>
</html>
