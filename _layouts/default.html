<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="site-shell">
      <header class="profile-sidebar">
        <h1><a href="{{ "/" | relative_url }}">Absalem Aroon</a></h1>
        {% if site.logo %}<img class="profile-image" src="{{ site.logo | relative_url }}" alt="Portrait of Absalem Aroon">{% endif %}
        <p class="profile-details">Department of Cyber Security<br>Federal University of Technology, Babura<br>Nigeria</p>
        <div class="social-icons">
          <a href="https://x.com/AbsalemAroon" target="_blank" rel="noopener" aria-label="Twitter / X">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <a href="https://www.linkedin.com/in/absalemaroon" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.063 2.063 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
            </svg>
          </a>
        </div>
      </header>
      <main class="main-column">
        <nav class="site-nav" aria-label="Main navigation">
          <a class="{% if page.url == "/" or page.url == "/index.html" %}active{% endif %}" href="{{ "/" | relative_url }}">Home</a>
          <a class="{% if page.url contains "/research" %}active{% endif %}" href="{{ "/research/" | relative_url }}">Research</a>
          <a class="{% if page.url contains "/software" %}active{% endif %}" href="{{ "/software/" | relative_url }}">Software</a>
          <a class="{% if page.url contains "/publications" %}active{% endif %}" href="{{ "/publications/" | relative_url }}">Publications</a>
          <a class="{% if page.url contains "/certificates" %}active{% endif %}" href="{{ "/certificates/" | relative_url }}">Certificates</a>
          <a class="{% if page.url contains "/blog" %}active{% endif %}" href="{{ "/blog/" | relative_url }}">Blog</a>
        </nav>
        <section class="content">{{ content }}</section>
      </main>
      <footer class="site-footer">
        <img src="{{ "/img/research-banner.png" | relative_url }}" alt="Research Banner" class="footer-banner">
      </footer>
    </div>
  </body>
</html>
