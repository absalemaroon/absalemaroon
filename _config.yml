theme: jekyll-theme-minimal
title: Absalem Aroon
logo: img/absalem-aroon.jpg
timezone: Africa/Lagos
description: Cybersecurity student at the Federal University of Technology, Babura, Nigeria, and Founder of Absalex Labs.

exclude:
  - CONTENT-GUIDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

collections:
  blog:
    output: true
    permalink: /blog/:title/
  certificates:
    output: true
    permalink: /certificates/:path/
  certificate_categories:
    output: true
    permalink: /certificates/category/:name/

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: blog
  - scope:
      path: ""
      type: certificates
    values:
      layout: default
  - scope:
      path: ""
      type: certificate_categories
    values:
      layout: certificate-category
