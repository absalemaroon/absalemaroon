theme: jekyll-theme-minimal
title: Absalem Aroon
logo: img/absalem-aroon.jpg
timezone: Africa/Lagos
description: Department of Cyber Security <br /> Federal University of Technology, Babura <br /> Nigeria<br />Founder, Absalex Labs<br />

# Notice there are NO spaces before 'collections'
collections:
  blog:
    output: true
    permalink: /blog/:title/
  certificates:
    output: true
    permalink: /certificates/:path/

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: blog
  - scope:
      path: ""
      type: certificates
    values:
      layout: default
