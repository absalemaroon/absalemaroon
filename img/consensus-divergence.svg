<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Consensus divergence caused by floating-point differences</title>
  <desc id="d">Two nodes execute the same transaction from the same prior state. A floating-point difference gives them different state hashes, so they reject each other's blocks and the chain forks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <rect x="250" y="20" width="300" height="60" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <text x="400" y="47" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Same transaction</text>
  <text x="400" y="69" text-anchor="middle" font-size="18" fill="#111">Same prior state</text>

  <line x1="360" y1="80" x2="220" y2="148" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="80" x2="580" y2="148" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="300" height="120" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="210" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Node A</text>
  <text x="210" y="210" text-anchor="middle" font-size="16" fill="#111">Float expression evaluated with</text>
  <text x="210" y="231" text-anchor="middle" font-size="16" fill="#111">a fused multiply-add</text>
  <text x="210" y="256" text-anchor="middle" font-size="18" font-family="Courier New, monospace" fill="#111">state hash: 9f3a…</text>

  <rect x="440" y="150" width="300" height="120" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="590" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Node B</text>
  <text x="590" y="210" text-anchor="middle" font-size="16" fill="#111">Same expression evaluated with</text>
  <text x="590" y="231" text-anchor="middle" font-size="16" fill="#111">separate rounding steps</text>
  <text x="590" y="256" text-anchor="middle" font-size="18" font-family="Courier New, monospace" fill="#111">state hash: c71d…</text>

  <text x="400" y="222" text-anchor="middle" font-size="44" font-weight="bold" fill="#111">≠</text>

  <line x1="210" y1="270" x2="210" y2="328" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="270" x2="590" y2="328" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="680" height="76" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <text x="400" y="361" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">State hashes differ</text>
  <text x="400" y="388" text-anchor="middle" font-size="18" fill="#111">Honest nodes reject each other's blocks, and the chain forks</text>

  <text x="400" y="434" text-anchor="middle" font-size="14" font-style="italic" fill="#444">Illustrative example; hash values are placeholders.</text>
</svg>
