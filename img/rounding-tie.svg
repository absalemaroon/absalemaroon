<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Why 0.1 + 0.2 rounds up to 0.30000000000000004</title>
  <desc id="d">A number line with two adjacent binary64 values. The exact sum of the stored values of 0.1 and 0.2 lies exactly halfway between them, and round-half-to-even selects the upper value.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="310" fill="#ffffff"/>

  <line x1="50" y1="160" x2="750" y2="160" stroke="#222" stroke-width="2"/>

  <circle cx="160" cy="160" r="9" fill="#222"/>
  <circle cx="400" cy="160" r="9" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <circle cx="640" cy="160" r="9" fill="#222"/>

  <text x="160" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Double stored for 0.3</text>
  <text x="160" y="198" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#111">0.29999999999999998890</text>

  <text x="400" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Exact sum of stored 0.1 + 0.2</text>
  <text x="400" y="220" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#111">0.30000000000000001665</text>

  <text x="640" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Next double up</text>
  <text x="640" y="198" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#111">0.30000000000000004441</text>

  <path d="M410,146 Q520,70 632,146" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="62" text-anchor="middle" font-size="15" fill="#111">Exactly halfway: tie, so round half to even</text>
  <text x="520" y="82" text-anchor="middle" font-size="15" fill="#111">selects this value</text>

  <line x1="160" y1="248" x2="640" y2="248" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="270" text-anchor="middle" font-size="14" fill="#444">Gap between adjacent doubles here = 2⁻⁵⁵ ≈ 5.55 × 10⁻¹⁷</text>

  <text x="400" y="298" text-anchor="middle" font-size="14" font-style="italic" fill="#444">Printed result: 0.30000000000000004. The literal 0.3 is stored as the lower double.</text>
</svg>
