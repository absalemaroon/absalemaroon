<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Scaled-integer storage of token amounts</title>
  <desc id="d">A displayed amount of 1.5 tokens is multiplied by 10 to the power 18 and stored on the ledger as the integer 1500000000000000000. Dividing by 10 to the power 18 is done only for display.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="290" fill="#ffffff"/>

  <rect x="30" y="50" width="220" height="110" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="140" y="82" text-anchor="middle" font-size="16" fill="#444">Shown to the user</text>
  <text x="140" y="125" text-anchor="middle" font-size="30" font-weight="bold" fill="#111">1.5 tokens</text>

  <rect x="550" y="50" width="220" height="110" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
  <text x="660" y="82" text-anchor="middle" font-size="16" fill="#444">Stored on the ledger (uint256)</text>
  <text x="660" y="125" text-anchor="middle" font-size="17" font-weight="bold" font-family="Courier New, monospace" fill="#111">1500000000000000000</text>

  <text x="400" y="86" text-anchor="middle" font-size="17" fill="#111">multiply by 10^18</text>
  <line x1="254" y1="98" x2="546" y2="98" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="546" y1="124" x2="254" y2="124" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="150" text-anchor="middle" font-size="17" fill="#111">divide by 10^18 (display only)</text>

  <text x="400" y="213" text-anchor="middle" font-size="16" fill="#111">The decimal point is a convention shared by the contract and the interface.</text>
  <text x="400" y="236" text-anchor="middle" font-size="16" fill="#111">The chain itself stores only the integer.</text>
</svg>
